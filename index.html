<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy Cook Master - Fixed</title>
    <style>
        :root { --red: #e63946; --green: #27ae60; --blue: #0984e3; }
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .app { max-width: 400px; width: 100%; background: white; border-radius: 30px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: var(--red); text-align: center; margin: 0; font-size: 24px; }
        .picker { display: flex; gap: 10px; margin: 20px 0; }
        .btn-s { flex: 1; padding: 12px; border-radius: 12px; border: 2px solid #eee; background: white; font-weight: bold; cursor: pointer; }
        .active-eco { border-color: var(--green); color: var(--green); background: #e8f8f0; }
        .active-quick { border-color: var(--blue); color: var(--blue); background: #eaf4ff; }
        input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 18px; box-sizing: border-box; text-align: center; }
        .go-btn { width: 100%; background: var(--red); color: white; border: none; padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #res { display: none; margin-top: 20px; padding: 20px; border-radius: 20px; background: #fff; border: 2px solid #eee; }
        .price { background: #fff9e6; padding: 10px; border-radius: 10px; font-weight: bold; color: #856404; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app">
    <h1>Easy Cook Pro</h1>
    <p style="text-align:center; color:#888; font-size:12px;">Mom's Kitchen Assistant</p>

    <div class="picker">
        <button id="eB" class="btn-s active-eco" onclick="set('eco')">🌿 Eco (Cheap)</button>
        <button id="qB" class="btn-s" onclick="set('quick')">⚡ Quick (Fast)</button>
    </div>

    <input type="text" id="dish" placeholder="Pathiri, Tea, Sambar...">
    <button class="go-btn" onclick="cook()">Show Settings</button>

    <div id="res">
        <div id="m" style="font-size:22px; font-weight:bold; margin-bottom:10px;">Mode</div>
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>Time: <b id="t">0</b></span>
            <span>Power: <b id="p">0</b></span>
        </div>
        <div class="price" id="c">Cost: ₹0.00</div>
        <p id="tip" style="font-size:13px; color:#666; margin-top:10px; font-style:italic;"></p>
    </div>
</div>

<script>
    let s = 'eco';
    function set(x) { 
        s = x; 
        document.getElementById('eB').className = 'btn-s' + (x==='eco'?' active-eco':'');
        document.getElementById('qB').className = 'btn-s' + (x==='quick'?' active-quick':'');
    }

    function cook() {
        const d = document.getElementById('dish').value.toLowerCase();
        const res = document.getElementById('res');
        if(!d) return; res.style.display = 'block';

        let mode = "Hot-Pot", w = 1000, m = 10, tip = "Watch carefully!";

        // FIXED LOGIC
        if (d.includes('pathiri') || d.includes('chappathi') || d.includes('dosa')) {
            mode = "Fry / Quick Fry";
            if(s === 'eco') { w = 800; m = 12; tip = "Slower heat, but saves the most money."; }
            else { w = 1800; m = 5; tip = "Very fast! Don't let it burn."; }
        } 
        else if (d.includes('rice') || d.includes('curry') || d.includes('sambar') || d.includes('dal')) {
            mode = "Braise / Slow Fire";
            if(s === 'eco') { w = 500; m = 35; tip = "The ultimate money-saving mode."; }
            else { w = 1400; m = 18; tip = "Cooks fast but uses more units."; }
        }
        else if (d.includes('tea') || d.includes('milk')) {
            mode = "Hot-Pot";
            if(s === 'eco') { w = 800; m = 8; tip = "Safer for milk, won't spill easily."; }
            else { w = 1600; m = 3; tip = "Boils in a flash!"; }
        }

        // Final Price Calculation (₹6 per unit)
        let cost = (w * (m / 60) / 1000) * 6;

        document.getElementById('m').innerText = "🍲 " + mode;
        document.getElementById('t').innerText = m + " mins";
        document.getElementById('p').innerText = w + "W";
        document.getElementById('c').innerText = "Estimated Cost: ₹" + cost.toFixed(2);
        document.getElementById('tip').innerText = tip;
    }
</script>

</body>
</html>
