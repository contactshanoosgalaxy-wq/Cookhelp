<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy Cook Smart-Sense</title>
    <style>
        :root { --red: #e63946; --green: #27ae60; --blue: #0984e3; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 15px; display: flex; justify-content: center; }
        .app { max-width: 420px; width: 100%; background: white; border-radius: 35px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h1 { color: var(--red); text-align: center; margin-bottom: 10px; font-size: 26px; }
        
        .section { margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 20px; border: 1px solid #eee; transition: 0.3s; }
        label { font-size: 11px; font-weight: 800; color: #999; text-transform: uppercase; display: block; margin-bottom: 10px; letter-spacing: 1px; }
        
        .picker { display: flex; gap: 8px; }
        .btn-s { flex: 1; padding: 12px; border-radius: 12px; border: 2px solid #eee; background: white; font-weight: 700; cursor: pointer; font-size: 13px; }
        .active-eco { border-color: var(--green); color: var(--green); background: #e8f8f0; }
        .active-quick { border-color: var(--blue); color: var(--blue); background: #eaf4ff; }

        select, input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 18px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--red); }
        
        .go-btn { width: 100%; background: var(--red); color: white; border: none; padding: 20px; border-radius: 20px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(230,57,70,0.3); }
        
        #res { display: none; margin-top: 20px; padding: 20px; border-radius: 25px; border: 3px solid var(--green); animation: pop 0.3s ease; text-align: left; }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .cost-box { background: #fff9e6; padding: 15px; border-radius: 15px; font-weight: 800; color: #856404; text-align: center; font-size: 22px; margin: 15px 0; border: 1px dashed #d4af37; }
    </style>
</head>
<body>

<div class="app">
    <h1>Easy Cook Smart</h1>

    <div class="section">
        <label>1. Pick Your Priority</label>
        <div class="picker">
            <button id="eB" class="btn-s active-eco" onclick="setMode('eco')">🌿 Save Money</button>
            <button id="qB" class="btn-s" onclick="setMode('quick')">⚡ Save Time</button>
        </div>
    </div>

    <div class="section">
        <label>2. What are you cooking?</label>
        <input type="text" id="dish" placeholder="e.g. Rice, Water, Tea..." oninput="updateQtyLabels()">
    </div>

    <div class="section" id="qtySection">
        <label id="qtyLabel">3. Amount</label>
        <select id="qty">
            <option value="0.5">Small Amount</option>
            <option value="1" selected>Medium Amount</option>
            <option value="3">Large Amount</option>
        </select>
    </div>

    <button class="go-btn" onclick="calculate()">Get Expert Guide</button>

    <div id="res">
        <div id="mName" style="font-size:24px; font-weight:900;">🍲 Mode</div>
        <div style="margin: 10px 0; font-size: 18px; line-height: 1.6;">
            ⏱️ Time: <b id="outT">0</b><br>
            🔌 Power: <b id="outP">0</b>
        </div>
        <div class="cost-box" id="outC">₹0.00</div>
        <p id="outTip" style="font-size:13px; color:#666; font-style:italic; border-top: 1px solid #eee; padding-top: 10px;"></p>
    </div>
</div>

<script>
    let currentMode = 'eco';
    
    function setMode(m) {
        currentMode = m;
        document.getElementById('eB').className = 'btn-s' + (m==='eco'?' active-eco':'');
        document.getElementById('qB').className = 'btn-s' + (m==='quick'?' active-quick':'');
    }

    // THIS IS THE SMART PART: Changes the dropdown based on what she types
    function updateQtyLabels() {
        const dish = document.getElementById('dish').value.toLowerCase();
        const label = document.getElementById('qtyLabel');
        const select = document.getElementById('qty');
        
        if (dish.includes('water') || dish.includes('milk') || dish.includes('tea')) {
            label.innerText = "3. How many Liters?";
            select.innerHTML = `
                <option value="0.2">Less than 1 Liter (1-2 cups)</option>
                <option value="1" selected>1 to 3 Liters (Family size)</option>
                <option value="4">5+ Liters (Large Pot)</option>
                <option value="8">10+ Liters (Bathing/Big Event)</option>
            `;
        } else if (dish.includes('rice') || dish.includes('dal') || dish.includes('sambar')) {
            label.innerText = "3. How many Kilograms (kg)?";
            select.innerHTML = `
                <option value="0.5">Less than 500g</option>
                <option value="1" selected>1kg to 2kg</option>
                <option value="2.5">3kg to 5kg</option>
            `;
        } else {
            label.innerText = "3. Quantity";
            select.innerHTML = `
                <option value="0.5">Small</option>
                <option value="1" selected>Medium</option>
                <option value="3">Large</option>
            `;
        }
    }

    function calculate() {
        const dish = document.getElementById('dish').value.toLowerCase().trim();
        const qtyMultiplier = parseFloat(document.getElementById('qty').value);
        const res = document.getElementById('res');
        
        if(!dish) return;
        res.style.display = 'block';

        let mode = "Hot-Pot", watts = 1000, baseMins = 10, tip = "Keep the pan centered.";

        // Food Logic
        if (dish.includes('water') || dish.includes('milk') || dish.includes('tea')) {
            mode = "🍵 Hot-Pot";
            if(currentMode === 'eco') { watts = 800; baseMins = 6; }
            else { watts = 1600; baseMins = 3; }
            tip = "For large amounts, use a lid to save ₹1.00+ on the bill.";
        } 
        else if (dish.includes('rice') || dish.includes('sambar') || dish.includes('dal')) {
            mode = "🍲 Braise / Slow Fire";
            if(currentMode === 'eco') { watts = 500; baseMins = 25; }
            else { watts = 1300; baseMins = 15; }
            tip = "The safest mode for big pots of rice.";
        }
        else if (dish.includes('pathiri') || dish.includes('chappathi') || dish.includes('fry')) {
            mode = "🍳 Fry / Quick Fry";
            watts = (currentMode === 'eco' ? 1000 : 1800);
            baseMins = 10;
            tip = "Quantity for fry depends on how many pieces you have.";
        } else if (!["food","rice","tea","water","milk","fry","curry"].some(x => dish.includes(x))) {
             // Shanu's Safety Check
             document.getElementById('mName').innerText = "❌ Not Edible";
             document.getElementById('outC').innerText = "₹0.00";
             document.getElementById('outTip').innerText = "Shanu, you can't cook a " + dish + "!";
             return;
        }

        let finalMins = Math.round(baseMins * qtyMultiplier);
        let units = (watts * (finalMins / 60)) / 1000;
        let cost = units * 6; // ₹6 per unit

        document.getElementById('mName').innerText = mode;
        document.getElementById('outT').innerText = finalMins + " mins";
        document.getElementById('outP').innerText = (watts > 0 ? watts + "W" : "OFF");
        document.getElementById('outC').innerText = "Cost: ₹" + cost.toFixed(2);
        document.getElementById('outTip').innerText = tip;
        document.getElementById('res').style.borderColor = (currentMode === 'eco' ? '#27ae60' : '#0984e3');
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
